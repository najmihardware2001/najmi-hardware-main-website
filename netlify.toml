[build]
  command = "npm run build"
  publish = "frontend/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  VITE_BACKEND_TYPE = "express"
  VITE_EXPRESS_API_URL = "/api"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["express", "serverless-http"]
  included_files = ["catalogue/public-catalogue.json"]

# This first deployment is the public catalogue/WhatsApp quotation site.
# The existing database-backed API source is in backend/ and has a separate
# documented activation step. No local database is uploaded by a Netlify build.
[[redirects]]
  from = "https://www.najmihardware.com/*"
  to = "https://najmihardware.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[redirects]]
  from = "/cart"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/checkout"
  to = "/app.html"
  status = 200

[[redirects]]
